<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Order summary card</title>


</head>




<body>

  <main class="container">
    <article class="card-content">
      <img class="img" src="./images/illustration-hero.svg" alt="illustration">

      <div class="card-text-content">
        <header>
          <h2> Order Summary</h2>
          <p> You can now listen to millions of songs, audiobooks, and podcasts on any
            device anywhere you like!</p>
        </header>
        <section class="second-container">

          <div class="third-container">
            <img class="img2" src="./images/icon-music.svg" alt="icon music">
            <div class="stacked">
              <p class="annual"> Annual Plan</p>
              <p class="price">$59.99/year</p>
            </div>
          </div>

          <a href="#">Change</a>
        </section>

        <button><p>Proceed to Payment</p></button>
        <a class="none" href="#"><p class="cancel">Cancel Order</p></a>
      </div>
    </article>
    <footer>
      <p class="attribution">
        Challenge by 
        <img src="./images/favicon-32x32.png" alt="icon">
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
        Coded by <a href="https://www.frontendmentor.io/profile/RiickyRiick" target="_blank">Rodrigo Arroyo-Haro</a>.
      </p>
    </footer>
    
  </main>
  

</body>

</html>
